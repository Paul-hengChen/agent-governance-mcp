name: CI

on:
  push:
    branches: [main, 'feat/**', 'integ/**', 'release/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: node scripts/test-lock.mjs -- node --test --test-reporter=tap --test-reporter-destination=stdout --test-reporter=./scripts/scenario-results-node.mjs --test-reporter-destination="$RUNNER_TEMP/test-results.xml" test/*.test.mjs

      - name: Check ticket scenario tests
        if: ${{ !cancelled() }}
        run: node scripts/check-scenario-tests.mjs --results "$RUNNER_TEMP/test-results.xml"
